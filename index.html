<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vera · Profit Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f9f6f0;--card:#fff;--bdr:#e8e0d0;--bdr2:#d8d0c0;--txt:#1a1a1a;--muted:#888;--dim:#bbb;--gold:#c47f00;--green:#2e7d32;--red:#c62828;--blue:#1565c0;--purple:#6a1b9a;--orange:#e65100}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

/* header */
#hdr{background:linear-gradient(135deg,#fffaf0,#fff8e8 50%,#fffaf0);border-bottom:2px solid #e8d8b0;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:#b06a00}
.sub{font-size:11px;color:#a08060;margin-top:2px}

/* tabs */
#tabs{display:flex;background:#fff;border-bottom:1px solid var(--bdr);overflow-x:auto;padding:0 14px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{font-size:12px;font-weight:600;padding:12px 13px;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}

/* body */
#body{padding:16px 14px;max-width:900px;margin:0 auto}
.panel{display:none}.panel.on{display:block}

/* cards */
.box{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:12px}
.box.hi{border-color:#e8d8b0}
.box.green{border-color:#a5d6a7;background:#f0faf0}
.box.blue{border-color:#90caf9;background:#f0f7ff}
.box.red{border-color:#ef9a9a;background:#fff5f5}

/* typography */
.ptitle{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:0}
.section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bdr)}

/* buttons */
.gbtn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;min-height:44px}
.sbtn{background:#f5f2ec;color:var(--gold);border:1px solid var(--bdr2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;min-height:36px}
.sbtn.sml{padding:4px 10px;font-size:11px;min-height:28px}
.sbtn.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.xbtn{background:none;border:none;color:var(--dim);font-size:20px;padding:2px 6px;line-height:1}

/* inputs */
.inp{background:#f5f2ec;border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;color:var(--txt);width:100%;outline:none;display:block}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--dim)}
textarea.inp{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field{margin-bottom:12px}

/* stat boxes */
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;text-align:center}
.stat .sn{font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.stat .sl{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}

/* deal type chips */
.dtype-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dtype-btn{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--bdr2);background:#f5f2ec;color:var(--muted)}
.dtype-btn.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* deal rows */
.drow{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--bdr)}
.drow:last-child{border-bottom:none}
.dtype-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.dinfo{flex:1;min-width:0}
.dname{font-size:14px;font-weight:700}
.dsub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.damts{text-align:right;flex-shrink:0}
.dvera{font-size:16px;font-weight:700;color:var(--green)}
.dgross{font-size:11px;color:var(--muted);margin-top:2px}

/* progress bar */
.pbar-wrap{margin-top:8px}
.pbar-track{height:8px;background:#f0ebe0;border-radius:4px;overflow:hidden;display:flex}
.pbar-seg{height:8px}
.pbar-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px}
.pleg{display:flex;align-items:center;gap:4px;font-size:10px}
.pleg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* filter row */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--bdr2);background:#f5f2ec;color:var(--muted)}
.fbtn.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* year card */
.year-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.year-title{font-size:16px;font-weight:700}
.year-income{text-align:right}
.year-income-lbl{font-size:10px;color:var(--muted);text-transform:uppercase}
.year-income-amt{font-size:22px;font-weight:700;color:var(--green)}

/* chips */
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}

/* misc */
.row{display:flex;align-items:center;gap:8px}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}
.empty{text-align:center;padding:32px 0;color:var(--dim);font-size:13px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}

@media(max-width:600px){
  .g2{grid-template-columns:1fr}.g3{gap:6px}.g4{grid-template-columns:1fr 1fr}
  .stat .sn{font-size:18px}#hdr .right{display:none}
  .dname{font-size:13px}.dvera{font-size:14px}
}
</style>
</head>
<body>

<div id="hdr">
  <div>
    <div class="logo">Vera Adegoke · Profit Dashboard 💰</div>
    <div class="sub">Real Estate · Columbus, OH</div>
  </div>
  <a href="index.html" style="font-size:12px;color:var(--gold);font-weight:700;text-decoration:none;border:1px solid var(--gold);border-radius:8px;padding:6px 12px">← Dashboard</a>
</div>

<div id="tabs">
  <button class="tab on" onclick="go('overview',this)">📊 Overview</button>
  <button class="tab" onclick="go('deals',this)">🗂️ All Deals</button>
  <button class="tab" onclick="go('byyear',this)">📆 By Year</button>
  <button class="tab" onclick="go('projection',this)">📈 Projection</button>
  <button class="tab" onclick="go('settings',this)">⚙️ Settings</button>
  <button class="tab" onclick="go('expenses',this)">💼 Expenses</button>
</div>

<div id="body">
  <div id="poverview"  class="panel on"></div>
  <div id="pdeals"     class="panel"></div>
  <div id="pexpenses"  class="panel"></div>
  <div id="pbyyear"    class="panel"></div>
  <div id="pprojection"class="panel"></div>
  <div id="psettings"  class="panel"></div>
</div>

<div id="toast"></div>

<script>
/* ── helpers ── */
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmt(n){return"$"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtK(n){return n>=1000?"$"+(n/1000).toFixed(1)+"k":fmt(n);}
function fmtM(n){return n>=1000000?"$"+(n/1000000).toFixed(2)+"M":n>=1000?"$"+(n/1000).toFixed(0)+"k":fmt(n);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function todayStr(){return new Date().toISOString().split("T")[0];}
function fmtDate(s){if(!s)return"";var d=new Date(s+"T12:00:00");return MN[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();}
function getCapYear(ds){var d=ds?new Date(ds+"T12:00:00"):new Date();var y=d.getFullYear(),m=d.getMonth()+1;return m>=3?y:y-1;}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2800);}
function chip(color,lbl){return'<span class="chip" style="background:'+color+'22;color:'+color+'">'+esc(lbl)+'</span>';}

var PANEL_IDS={overview:"poverview",deals:"pdeals",byyear:"pbyyear",projection:"pprojection",settings:"psettings"};

/* ── BUSINESS EXPENSES ── */
function expTotalAll(){
  return EXPENSES.reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
}
function expTotalByYear(yr){
  return EXPENSES.filter(function(e){return !yr||new Date(e.date).getFullYear()===yr;})
    .reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
}
function expCatMap(yr){
  var map={};
  EXPENSES.filter(function(e){return !yr||new Date(e.date).getFullYear()===yr;})
    .forEach(function(e){var c=e.cat||'Other';map[c]=(map[c]||0)+(parseFloat(e.amount)||0);});
  return map;
}
function addExpense(){
  var cat=document.getElementById('exp-cat').value;
  var desc=(document.getElementById('exp-desc').value||'').trim();
  var amt=parseFloat(document.getElementById('exp-amount').value)||0;
  var date=document.getElementById('exp-date').value;
  if(!cat||!desc||amt<=0||!date){alert('Please fill in all fields.');return;}
  EXPENSES.push({id:Date.now().toString(36),cat:cat,desc:desc,amount:amt,date:date});
  EXPENSES.sort(function(a,b){return b.date.localeCompare(a.date);});
  save();renderExpenses();
  document.getElementById('exp-desc').value='';
  document.getElementById('exp-amount').value='';
}
function deleteExpense(id){
  if(!confirm('Delete this expense?'))return;
  EXPENSES=EXPENSES.filter(function(e){return e.id!==id;});
  save();renderExpenses();
}
function renderExpenses(){
  var sel=document.getElementById('exp-year-filter');
  var yr=sel?parseInt(sel.value):new Date().getFullYear();
  var list=EXPENSES.filter(function(e){return !yr||new Date(e.date).getFullYear()===yr;});
  var totalExp=list.reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
  var veraIncome=DEALS.filter(function(d){
    if(!yr)return true;
    var dy=d.closedDate?new Date(d.closedDate).getFullYear():0;
    return dy===yr;
  }).reduce(function(s,d){return s+(d.vera||0);},0);
  var net=veraIncome-totalExp;

  var allYrs=new Set([new Date().getFullYear()]);
  EXPENSES.forEach(function(e){if(e.date)allYrs.add(new Date(e.date).getFullYear());});
  DEALS.forEach(function(d){if(d.closedDate)allYrs.add(new Date(d.closedDate).getFullYear());});
  var yrOpts=[...allYrs].sort().map(function(y){
    return '<option value="'+y+'"'+(y===yr?' selected':'')+'>'+y+'</option>';
  }).join('');

  var catM=expCatMap(yr);
  var maxC=Math.max.apply(null,Object.values(catM).concat([1]));
  var catOpts=EXP_CATS.map(function(c){return '<option>'+c+'</option>';}).join('');
  var today=new Date().toISOString().slice(0,10);

  var inpStyle='width:100%;font-size:13px;padding:8px 10px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--bg);color:var(--fg);box-sizing:border-box;';

  var html='<div class="ptitle mb14">💼 Business Expenses</div>';

  // Year filter
  html+='<div class="box mb10" style="display:flex;align-items:center;gap:10px;">'
    +'<label style="font-size:11px;font-weight:700;color:var(--muted);">FILTER YEAR</label>'
    +'<select id="exp-year-filter" onchange="renderExpenses()" style="'+inpStyle+'width:auto;">'
    +'<option value="0">All Time</option>'+yrOpts+'</select></div>';

  // Summary pills
  html+='<div class="g3 mb10">'
    +'<div class="stat"><div class="sn" style="color:var(--rose)">'+fmtK(totalExp)+'</div><div class="sl">Total Expenses</div></div>'
    +'<div class="stat"><div class="sn" style="color:var(--green)">'+fmtK(veraIncome)+'</div><div class="sl">Commissions Earned</div></div>'
    +'<div class="stat"><div class="sn" style="color:'+(net>=0?'var(--green)':'var(--rose)')+'">'+fmtK(net)+'</div>'
    +'<div class="sl">'+(net>=0?'Net Profit':'Net Loss')+'</div></div>'
    +'</div>';

  // Category bars
  if(Object.keys(catM).length){
    html+='<div class="box mb10"><div class="section" style="margin-top:0">By Category</div>';
    Object.entries(catM).sort(function(a,b){return b[1]-a[1];}).forEach(function(pair){
      var pct=(pair[1]/maxC*100).toFixed(1);
      html+='<div style="margin-bottom:9px;">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;">'
        +'<span style="font-weight:600">'+pair[0]+'</span>'
        +'<span style="color:var(--rose);font-weight:700">'+fmtK(pair[1])+'</span></div>'
        +'<div style="height:6px;background:rgba(0,0,0,0.08);border-radius:10px;overflow:hidden;">'
        +'<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#8B1A1A,#C94040);border-radius:10px;"></div>'
        +'</div></div>';
    });
    html+='</div>';
  }

  // Add form
  html+='<div class="box mb10"><div class="section" style="margin-top:0">Log an Expense</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">'
    +'<div><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">CATEGORY</div>'
    +'<select id="exp-cat" style="'+inpStyle+'"><option value="">Select…</option>'+catOpts+'</select></div>'
    +'<div><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">DATE</div>'
    +'<input id="exp-date" type="date" value="'+today+'" style="'+inpStyle+'"></div></div>'
    +'<div style="margin-bottom:8px;"><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">DESCRIPTION</div>'
    +'<input id="exp-desc" type="text" placeholder="e.g. OBAR dues, Facebook ad…" maxlength="80" style="'+inpStyle+'"></div>'
    +'<div style="margin-bottom:12px;"><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;">AMOUNT ($)</div>'
    +'<input id="exp-amount" type="number" inputmode="decimal" placeholder="0.00" style="'+inpStyle+'"></div>'
    +'<button onclick="addExpense()" style="width:100%;padding:12px;font-size:12px;font-weight:700;letter-spacing:0.08em;'
    +'background:linear-gradient(135deg,#6B1A1A,#8B2222);color:#F0C840;border:none;border-radius:10px;cursor:pointer;">+ RECORD EXPENSE</button>'
    +'</div>';

  // Expense list
  html+='<div class="box"><div class="section" style="margin-top:0">Expense Log ('+list.length+' records)</div>';
  if(!list.length){
    html+='<div style="text-align:center;padding:24px;font-size:13px;color:var(--muted);font-style:italic;">No expenses yet for this period.</div>';
  } else {
    list.forEach(function(e){
      html+='<div style="display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--bdr);">'
        +'<div style="flex:1;min-width:0;">'
        +'<div style="font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+e.desc+'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+e.cat+' · '+e.date+'</div>'
        +'</div>'
        +'<div style="font-size:14px;font-weight:700;color:var(--rose);flex-shrink:0;white-space:nowrap;">'+fmtK(parseFloat(e.amount||0))+'</div>'
        +'<button onclick="deleteExpense(\''+e.id+'\')" style="background:none;border:none;color:rgba(178,34,34,0.3);font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0;">×</button>'
        +'</div>';
    });
    html+='<div style="display:flex;justify-content:space-between;padding:10px 0 4px;font-weight:700;font-size:13px;">'
      +'<span style="color:var(--muted);">TOTAL</span>'
      +'<span style="color:var(--rose);">'+fmtK(totalExp)+'</span></div>';
  }
  html+='</div>';

  document.getElementById('pexpenses').innerHTML=html;
}

function go(id,btn){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});
  document.getElementById("p"+id).classList.add("on");
  btn.classList.add("on");ACTIVE=id;
  if(id==="expenses") renderExpenses();
  if(id==="overview") renderOverview();
}

/* ── deal types ── */
var DTYPES=[
  {id:"newbuild",   label:"🏗️ New Build",       icon:"🏗️", color:"#1565c0"},
  {id:"existing",   label:"🏠 Existing Purchase", icon:"🏠", color:"#2e7d32"},
  {id:"shortsale",  label:"🏚️ Short Sale",        icon:"🏚️", color:"#c62828"},
  {id:"land",       label:"🌳 Land / Lot",         icon:"🌳", color:"#558b2f"},
  {id:"commercial", label:"🏢 Commercial",          icon:"🏢", color:"#6a1b9a"},
  {id:"rental",     label:"🔑 Rental / Lease",      icon:"🔑", color:"#e65100"},
  {id:"other",      label:"📦 Other",               icon:"📦", color:"#888"}
];
function dtypeMeta(id){return DTYPES.find(function(d){return d.id===id;})||DTYPES[DTYPES.length-1];}

/* ── settings ── */
var CFG={
  commRate:3,
  redOnePct:30,
  capLimit:6000,
  ment1Pct:20,
  ment2Pct:10,
  inMentoring:true,
  dealsCompleted:0,
  businessStartDate:"2026-04-26",
  annualIncomeGoal:100000,
  paceWindow:"all",
  scriptures:[
    {ref:"1 Thessalonians 5:24", text:"Faithful is he that calleth you, who also will do it."},
    {ref:"Romans 9:16",          text:"So then it is not of him that willeth, nor of him that runneth, but of God that sheweth mercy."},
    {ref:"Proverbs 21:31",       text:"The horse is prepared against the day of battle: but safety is of the LORD."},
    {ref:"Isaiah 45:2",          text:"I will go before thee, and make the crooked places straight."},
    {ref:"Proverbs 10:22",       text:"The blessing of the LORD, it maketh rich, and he addeth no sorrow with it."},
    {ref:"Proverbs 12:2",        text:"A good man obtaineth favour of the LORD."}
  ],
  clients:["Suzel & Husband","Si Zahara","Lucy","Zion","Michael (Dr. Horton)","Pastor Lanre"],
  builders:["Maronda Homes","Rockford Homes","Fisher's Homes","Dr. Horton","Ryan Homes","M/I Homes"]
};

/* ── deals data ── */
var DEALS=[];
var EXPENSES=[];
var EXP_CATS=['MLS & Board Fees','Marketing & Ads','Signs & Lockboxes','Office & Supplies',
  'Fuel & Transportation','Phone & Internet','Software & Tools','Education & Training',
  'Professional Fees','Gifts & Client Care','Staging & Photography','Other'];

var DEAL_FILTER={year:"all",type:"all",builder:"all"};
var DEAL_OPEN=false;
var DEAL_EDITING=null;
var ND={
  client:"",clientCustom:"",
  type:"newbuild",
  builder:"",builderCustom:"",
  referral:"",
  price:"",
  commRate:"",
  closeDate:todayStr(),
  notes:""
};

/* ── calc ── */
function calcDeal(price,rate,closeDate,dealsBeforeThis,capPaidBefore){
  var gross=price*(rate/100);
  var redOnePct=CFG.redOnePct/100;
  var redOneAmt=gross*redOnePct;
  var remaining=CFG.capLimit-capPaidBefore;
  if(remaining<=0)redOneAmt=0;
  else if(redOneAmt>remaining)redOneAmt=remaining;
  var mentAmt=0;
  if(CFG.inMentoring){
    var mp=dealsBeforeThis<6?CFG.ment1Pct/100:CFG.ment2Pct/100;
    mentAmt=gross*mp;
  }
  var vera=gross-redOneAmt-mentAmt;
  return{gross:gross,redOne:redOneAmt,mentoring:mentAmt,vera:vera};
}

function recalcAll(){
  // sort by close date
  var sorted=DEALS.slice().sort(function(a,b){return a.closeDate.localeCompare(b.closeDate);});
  var capByYear={};var dealsBefore=0;
  sorted.forEach(function(d){
    var cy=getCapYear(d.closeDate);
    if(!capByYear[cy])capByYear[cy]=0;
    var rate=parseFloat(d.commRate)||CFG.commRate;
    var res=calcDeal(parseFloat(d.price),rate,d.closeDate,dealsBefore,capByYear[cy]);
    d.gross=res.gross;d.redOne=res.redOne;d.mentoring=res.mentoring;d.vera=res.vera;
    capByYear[cy]+=res.redOne;
    dealsBefore++;
  });
  // copy back

/* ── ALL DEALS ── */
function renderDeals(){

    if(DEAL_FILTER.year!=="all"&&getCapYear(d.closeDate)!=DEAL_FILTER.year)return false;
    if(DEAL_FILTER.type!=="all"&&d.type!==DEAL_FILTER.type)return false;

  }).sort(function(a,b){return b.closeDate.localeCompare(a.closeDate);});

  var yearBtns=['<button class="fbtn'+(DEAL_FILTER.year==="all"?" on":"")+'" onclick="setFilter(\'year\',\'all\')">All Years</button>']

  var typeBtns=['<button class="fbtn'+(DEAL_FILTER.type==="all"?" on":"")+'" onclick="setFilter(\'type\',\'all\')">All Types</button>']
    .concat(DTYPES.map(function(dt){var cnt=DEALS.filter(function(d){return d.type===dt.id;}).length;if(!cnt)return"";return'<button class="fbtn'+(DEAL_FILTER.type===dt.id?" on":"")+'" onclick="setFilter(\'type\',\''+dt.id+'\')">'+dt.icon+' '+dt.label.split(" ").slice(1).join(" ")+'</button>';})).join("");

    html+=filtered.map(function(d){return dealRow(d,false);}).join("");
  } else {
    html+='<div class="empty">No deals match this filter</div>';
  }
  document.getElementById("pdeals").innerHTML=html;
  if(DEAL_OPEN)renderAddForm("pdeals");

/* ── BY YEAR ── */
function renderByYear(){
  recalcAll();
  var years=getYears();
  var html='<div class="ptitle mb14">📆 By Year</div>';
  if(!years.length){html+='<div class="empty">No deals recorded yet</div>';document.getElementById("pbyyear").innerHTML=html;return;}
  years.sort(function(a,b){return b-a;}).forEach(function(cy){
    var yDeals=DEALS.filter(function(d){return getCapYear(d.closeDate)===cy;}).sort(function(a,b){return b.closeDate.localeCompare(a.closeDate);});
    var yVera=yDeals.reduce(function(s,d){return s+(d.vera||0);},0);
    var yGross=yDeals.reduce(function(s,d){return s+(d.gross||0);},0);
    var yRedOne=yDeals.reduce(function(s,d){return s+(d.redOne||0);},0);
    var yMent=yDeals.reduce(function(s,d){return s+(d.mentoring||0);},0);
    var yVol=yDeals.reduce(function(s,d){return s+parseFloat(d.price||0);},0);
    var capMet=yRedOne>=CFG.capLimit;
    // by type counts
    var typeSummary=DTYPES.map(function(dt){var c=yDeals.filter(function(d){return d.type===dt.id;}).length;return c?dt.icon+" "+c+" "+dt.label.split(" ").slice(1).join(" "):null;}).filter(Boolean).join(" · ");
    // top builder
    var bCount={};yDeals.filter(function(d){return d.builder;}).forEach(function(d){bCount[d.builder]=(bCount[d.builder]||0)+1;});
    var topB=Object.keys(bCount).sort(function(a,b){return bCount[b]-bCount[a];})[0];

    html+='<div class="box mb10">';
    html+='<div class="year-header"><div><div class="year-title">📆 '+cy+' – '+(cy+1)+' <span style="font-size:11px;color:var(--muted)">(Mar–Feb)</span></div>'
      +'<div style="font-size:12px;color:var(--muted);margin-top:3px">'+yDeals.length+' deals · Vol: '+fmtM(yVol)+'</div></div>'
      +'<div class="year-income"><div class="year-income-lbl">Take-Home</div><div class="year-income-amt">'+fmt(yVera)+'</div></div></div>';

    // summary grid
    html+='<div class="g3" style="margin-bottom:10px">'
      +'<div style="background:#f5f2ec;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:3px">Gross</div><div style="font-size:16px;font-weight:700">'+fmtK(yGross)+'</div></div>'
      +'<div style="background:#ffebee;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:#c62828;text-transform:uppercase;margin-bottom:3px">RedOne</div><div style="font-size:16px;font-weight:700;color:#c62828">-'+fmtK(yRedOne)+'</div>'+(capMet?'<div style="font-size:9px;color:#2e7d32">✅ Cap met</div>':'')+'</div>'
      +'<div style="background:#fff8e8;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;color:#e65100;text-transform:uppercase;margin-bottom:3px">Mentoring</div><div style="font-size:16px;font-weight:700;color:#e65100">-'+fmtK(yMent)+'</div></div>'
      +'</div>';

    if(typeSummary)html+='<div style="font-size:11px;color:var(--muted);margin-bottom:6px">'+typeSummary+'</div>';
    if(topB)html+='<div style="font-size:11px;color:var(--muted);margin-bottom:10px">🏗️ Top builder: <strong>'+esc(topB)+'</strong> ('+bCount[topB]+' deals)</div>';

    // progress bar
    if(yGross>0){
      html+='<div class="pbar-track" style="margin-bottom:6px">'
        +'<div class="pbar-seg" style="width:'+Math.round(yRedOne/yGross*100)+'%;background:#ef9a9a"></div>'
        +'<div class="pbar-seg" style="width:'+Math.round(yMent/yGross*100)+'%;background:#ffcc80"></div>'
        +'<div class="pbar-seg" style="width:'+Math.round(yVera/yGross*100)+'%;background:#a5d6a7"></div>'
        +'</div>'
        +'<div class="pbar-legend">'
        +'<div class="pleg"><div class="pleg-dot" style="background:#ef9a9a"></div><span style="color:#c62828">RedOne '+Math.round(yRedOne/yGross*100)+'%</span></div>'
        +'<div class="pleg"><div class="pleg-dot" style="background:#ffcc80"></div><span style="color:#e65100">Mentoring '+Math.round(yMent/yGross*100)+'%</span></div>'
        +'<div class="pleg"><div class="pleg-dot" style="background:#a5d6a7"></div><span style="color:#2e7d32">Vera '+Math.round(yVera/yGross*100)+'%</span></div>'
        +'</div>';
    }

    // deals list
    html+='<div style="margin-top:12px;border-top:1px solid var(--bdr);padding-top:4px">';
    yDeals.forEach(function(d){html+=dealRow(d,false);});
    html+='</div></div>';

/* ── DEAL ROW ── */
function dealRow(d,compact){
  var dt=dtypeMeta(d.type);
  var rate=parseFloat(d.commRate)||CFG.commRate;
  var party=d.type==="newbuild"?d.builder:d.referral;
  return'<div class="drow">'
    +'<div class="dtype-icon" style="background:'+dt.color+'22">'+dt.icon+'</div>'
    +'<div class="dinfo">'
    +'<div class="dname">'+esc(d.client||"Unknown")+'</div>'
    +'<div class="dsub">'+fmtDate(d.closeDate)+' · '+esc(dt.label.split(" ").slice(1).join(" "))+(party?' · '+esc(party):"")+(compact?"":'<br/>Sale: $'+Number(d.price||0).toLocaleString()+' @ '+rate+'%')+'</div>'
    +(d.notes&&!compact?'<div class="dsub" style="font-style:italic">'+esc(d.notes)+'</div>':"")
    +'</div>'
    +'<div class="damts">'
    +'<div class="dvera">'+fmt(d.vera||0)+'</div>'
    +'<div class="dgross">'+fmtK(d.gross||0)+' gross</div>'
    +'</div>'
    +(!compact?'<button class="xbtn" onclick="deleteDeal(\''+d.id+'\')">&#10005;</button>':"")
    +'</div>';
}

  var target=document.getElementById(targetId);
  if(!target)return;

  var wrap=document.createElement("div");
  wrap.id="deal-add-form";
  wrap.style.marginBottom="14px";
  target.insertBefore(wrap,target.firstChild);

  var dt=dtypeMeta(ND.type);
  var isNewBuild=ND.type==="newbuild";

  var clientOpts='<option value="">-- Pick existing client --</option>'
    +CFG.clients.map(function(c){return'<option value="'+esc(c)+'"'+(ND.client===c?" selected":"")+'>'+esc(c)+'</option>';}).join("")
    +'<option value="__custom__"'+(ND.client==="__custom__"?" selected":"")+'>+ Type new name</option>';

function re(){
  if(ACTIVE==="overview")renderOverview();
  else if(ACTIVE==="deals")renderDeals();
  else if(ACTIVE==="byyear")renderByYear();
  else if(ACTIVE==="projection")renderProjection();
}

function saveDeal(){
  var client=ND.client==="__custom__"?ND.clientCustom.trim():(ND.client||"").trim();
  if(!client){toast("Please enter a client name");return;}
  var price=parseFloat((ND.price||"").replace(/[^0-9.]/g,""));
  if(!price||price<=0){toast("Please enter a valid sale price");return;}
  if(!ND.closeDate){toast("Please select a close date");return;}
  var builder=ND.type==="newbuild"?(ND.builder==="__custom__"?ND.builderCustom.trim():ND.builder):"";
  var deal={
    id:"d"+Date.now(),
    client:client,
    type:ND.type,
    builder:builder,
    referral:ND.referral||"",
    price:price,
    commRate:ND.commRate||CFG.commRate,
    closeDate:ND.closeDate,
    notes:ND.notes||"",
    gross:0,redOne:0,mentoring:0,vera:0
  };
  DEALS.push(deal);
  CFG.dealsCompleted=DEALS.length;
  DEAL_OPEN=false;
  // remove form
  var f=document.getElementById("deal-add-form");
  if(f)f.parentNode.removeChild(f);
  recalcAll();save();
  toast("Deal saved! "+esc(client)+" 🎉");
  re();
}

function deleteDeal(id){
  if(!confirm("Delete this deal?"))return;
  DEALS=DEALS.filter(function(d){return d.id!==id;});
  save();recalcAll();
  toast("Deal deleted");re();
}

function setFilter(key,val){
  DEAL_FILTER[key]=val;renderDeals();
}

   PROJECTION + SCRIPTURE TAB

var SCRIPTURE_IDX=0;

function renderProjection(){
  recalcAll();
  var html="";

  /* ── SCRIPTURE SECTION ── */
  var scrips=CFG.scriptures;
  var s=scrips[SCRIPTURE_IDX%scrips.length];
  html+='<div style="background:linear-gradient(135deg,#1a0a00,#2d1400 50%,#1a0a00);border-radius:16px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden">'
    +'<div style="position:absolute;top:10px;right:14px;font-size:28px;opacity:.15">✝️</div>'
    +'<div style="font-size:10px;font-weight:700;color:#c47f00;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">🙏 Word of God — Reminder</div>'
    +'<div style="font-size:15px;font-style:italic;color:#fff8e8;line-height:1.7;margin-bottom:10px">"'+esc(s.text)+'"</div>'
    +'<div style="font-size:12px;font-weight:700;color:#c47f00">— '+esc(s.ref)+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:14px">'
    +'<button onclick="SCRIPTURE_IDX--;renderProjection()" style="background:#ffffff22;border:1px solid #ffffff33;border-radius:8px;color:#fff8e8;padding:6px 14px;font-size:12px;font-weight:600">← Prev</button>'
    +'<button onclick="SCRIPTURE_IDX++;renderProjection()" style="background:#c47f00;border:none;border-radius:8px;color:#fff;padding:6px 14px;font-size:12px;font-weight:600">Next →</button>'
    +'<span style="font-size:11px;color:#ffffff66;align-self:center;margin-left:4px">'+(SCRIPTURE_IDX<0?((scrips.length+(SCRIPTURE_IDX%scrips.length))%scrips.length)+1:((SCRIPTURE_IDX%scrips.length)+1))+' of '+scrips.length+'</span>'
    +'</div></div>';

  /* ── PROJECTION ENGINE ── */
  var today=new Date();today.setHours(0,0,0,0);
  var todayS=today.toISOString().split("T")[0];
  var startDate=new Date((CFG.businessStartDate||"2026-04-26")+"T00:00:00");
  var daysActive=Math.max(1,Math.round((today-startDate)/(1000*60*60*24)));

  // filter deals by pace window
  var windowDays={
    "30":30,"60":60,"quarter":90,"6mo":180,"12mo":365,"all":99999
  }[CFG.paceWindow]||99999;
  var windowStart=new Date(today);windowStart.setDate(today.getDate()-windowDays);
  var windowStartS=windowStart.toISOString().split("T")[0];
  var paceDeals=CFG.paceWindow==="all"
    ?DEALS.slice()
    :DEALS.filter(function(d){return d.closeDate>=windowStartS;});
  var paceDealsCount=paceDeals.length;
  var paceDays=CFG.paceWindow==="all"?daysActive:Math.min(windowDays,daysActive);
  var dealsPerDay=paceDealsCount/Math.max(1,paceDays);
  var avgVera=paceDealsCount>0?paceDeals.reduce(function(s,d){return s+(d.vera||0);},0)/paceDealsCount:0;
  var avgPrice=paceDealsCount>0?paceDeals.reduce(function(s,d){return s+parseFloat(d.price||0);},0)/paceDealsCount:0;
  var avgGross=paceDealsCount>0?paceDeals.reduce(function(s,d){return s+(d.gross||0);},0)/paceDealsCount:0;

  // projection targets
  var dec31=new Date(today.getFullYear(),11,31);
  var capYear=getCapYear(todayS);
  var feb28=new Date(capYear+1,1,28);
  var daysToCalYear=Math.max(0,Math.round((dec31-today)/(1000*60*60*24)));
  var daysToCapYear=Math.max(0,Math.round((feb28-today)/(1000*60*60*24)));

  // projected deals
  var projDealsCalYear=Math.round(dealsPerDay*daysToCalYear);
  var projDealsCapYear=Math.round(dealsPerDay*daysToCapYear);

  // current totals
  var totalVera=DEALS.reduce(function(s,d){return s+(d.vera||0);},0);
  var totalDeals=DEALS.length;
  var curYearRedOne=DEALS.filter(function(d){return getCapYear(d.closeDate)===capYear;}).reduce(function(s,d){return s+(d.redOne||0);},0);

  // project cap hit
  var capRemaining=Math.max(0,CFG.capLimit-curYearRedOne);
  var redOnePerDeal=paceDealsCount>0?paceDeals.reduce(function(s,d){return s+(d.redOne||0);},0)/paceDealsCount:0;
  var dealsToCapHit=redOnePerDeal>0?Math.ceil(capRemaining/redOnePerDeal):999;
  var daysToCapHit=dealsPerDay>0?Math.round(dealsToCapHit/dealsPerDay):999;
  var capHitDate=new Date(today);capHitDate.setDate(today.getDate()+daysToCapHit);
  var capAlreadyMet=curYearRedOne>=CFG.capLimit;

  // projected income scenarios
  function projIncome(deals,boost){
    var income=0;var capPaid=curYearRedOne;var dc=totalDeals;
    for(var i=0;i<Math.round(deals*boost);i++){
      var res=calcDeal(avgPrice,parseFloat(CFG.commRate),todayS,dc,capPaid);
      income+=res.vera;capPaid+=res.redOne;dc++;
    }
    return income;
  }

  var calConserv=totalVera+projIncome(projDealsCalYear,0.75);
  var calLikely =totalVera+projIncome(projDealsCalYear,1.00);
  var calBest   =totalVera+projIncome(projDealsCalYear,1.25);
  var capConserv=totalVera+projIncome(projDealsCapYear,0.75);
  var capLikely =totalVera+projIncome(projDealsCapYear,1.00);
  var capBest   =totalVera+projIncome(projDealsCapYear,1.25);

  // goal tracking
  var goal=CFG.annualIncomeGoal||100000;
  var goalRemaining=Math.max(0,goal-totalVera);
  var dealsNeededForGoal=avgVera>0?Math.ceil(goalRemaining/avgVera):0;
  var goalPct=Math.min(100,Math.round(totalVera/goal*100));
  var onTrack=calLikely>=goal;

  // pace window selector
  var pwOpts=[
    {val:"30",lbl:"Last 30 Days"},
    {val:"60",lbl:"Last 60 Days"},
    {val:"quarter",lbl:"Last Quarter"},
    {val:"6mo",lbl:"Last 6 Months"},
    {val:"12mo",lbl:"Last 12 Months"},
    {val:"all",lbl:"All Deals Ever"}
  ];
  html+='<div class="box mb10">'
    +'<div class="rowsb mb10"><div style="font-size:15px;font-weight:700;color:var(--gold)">📈 Income Projection</div>'
    +'<select class="inp" style="width:auto;font-size:12px;padding:6px 10px" onchange="CFG.paceWindow=this.value;save();renderProjection()">'
    +pwOpts.map(function(o){return'<option value="'+o.val+'"'+(CFG.paceWindow===o.val?" selected":"")+'>'+o.lbl+'</option>';}).join("")
    +'</select></div>'

    // pace stats
    +'<div style="background:#f5f2ec;border-radius:10px;padding:12px;margin-bottom:12px">'
    +'<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Your Pace ('+pwOpts.find(function(o){return o.val===CFG.paceWindow;}).lbl+')</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +'<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:var(--gold)">'+paceDealsCount+'</div><div style="font-size:10px;color:var(--muted)">Deals</div></div>'
    +'<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:var(--gold)">'+(dealsPerDay*30).toFixed(1)+'</div><div style="font-size:10px;color:var(--muted)">Per Month</div></div>'
    +'<div style="text-align:center"><div style="font-size:18px;font-weight:700;color:var(--gold)">'+fmt(avgVera)+'</div><div style="font-size:10px;color:var(--muted)">Avg Income</div></div>'
    +'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">Active since '+fmtDate(CFG.businessStartDate)+' · '+daysActive+' days · 1 deal every '+(dealsPerDay>0?Math.round(1/dealsPerDay):0)+' days</div>'
    +'</div>'

    // calendar year projection
    +'<div style="font-size:13px;font-weight:700;color:var(--txt);margin-bottom:8px">To Dec 31, '+today.getFullYear()+' <span style="font-size:11px;color:var(--muted)">('+daysToCalYear+' days left)</span></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'
    +projBox("Conservative","75% pace",calConserv,"#e65100")
    +projBox("Likely","100% pace",calLikely,"#2e7d32")
    +projBox("Best Case","125% pace",calBest,"#1565c0")
    +'</div>'

    // cap year projection
    +'<div style="font-size:13px;font-weight:700;color:var(--txt);margin-bottom:8px">To Feb 28, '+(capYear+1)+' <span style="font-size:11px;color:var(--muted)">(cap year end · '+daysToCapYear+' days left)</span></div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +projBox("Conservative","75% pace",capConserv,"#e65100")
    +projBox("Likely","100% pace",capLikely,"#2e7d32")
    +projBox("Best Case","125% pace",capBest,"#1565c0")
    +'</div></div>';

  // RedOne cap projection
  html+='<div class="box mb10">';
  if(capAlreadyMet){
    html+='<div style="background:#e8f5e9;border-radius:10px;padding:12px;text-align:center">'
      +'<div style="font-size:20px">🎉</div>'
      +'<div style="font-size:14px;font-weight:700;color:#2e7d32;margin-top:4px">RedOne Cap Already Met!</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-top:4px">RedOne takes $0 from all remaining deals this year. Every deal goes further into Vera\'s pocket.</div>'
      +'</div>';
  } else {
    html+='<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:8px">🏢 RedOne Cap Projection</div>'
      +'<div style="background:#fff8e8;border-radius:10px;padding:12px">'
      +'<div style="font-size:13px;margin-bottom:6px">At current pace, cap will be met in approximately:</div>'
      +'<div style="font-size:22px;font-weight:700;color:#c47f00;margin-bottom:4px">'+dealsToCapHit+' more deal'+(dealsToCapHit!==1?'s':'')+'</div>'
      +'<div style="font-size:12px;color:var(--muted)">Est. date: '+fmtDate(capHitDate.toISOString().split("T")[0])+'</div>'
      +'<div style="font-size:12px;color:var(--muted);margin-top:4px">Remaining to cap: '+fmt(capRemaining)+' of '+fmt(CFG.capLimit)+'</div>'
      +'<div style="height:8px;background:#f0ebe0;border-radius:4px;margin-top:8px;overflow:hidden">'
      +'<div style="height:8px;background:#f0d080;border-radius:4px;width:'+Math.min(100,Math.round(curYearRedOne/CFG.capLimit*100))+'%"></div>'
      +'</div></div>';
  }
  html+='</div>';

  // goal tracker
  html+='<div class="box mb10">'
    +'<div class="rowsb mb10"><div style="font-size:13px;font-weight:700;color:var(--gold)">🎯 Annual Income Goal</div>'
    +'<div style="display:flex;align-items:center;gap:6px">'
    +'<span style="font-size:12px;color:var(--muted)">Goal: $</span>'
    +'<input type="number" value="'+CFG.annualIncomeGoal+'" oninput="CFG.annualIncomeGoal=parseInt(this.value)||100000;save();renderProjection()" style="background:#f5f2ec;border:1px solid var(--bdr2);border-radius:6px;padding:4px 8px;font-size:13px;width:100px;outline:none"/>'
    +'</div></div>'
    +'<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px">'
    +'<span>'+fmt(totalVera)+' earned</span><span>'+fmt(goal)+' goal</span></div>'
    +'<div style="height:12px;background:#f0ebe0;border-radius:6px;overflow:hidden;margin-bottom:8px">'
    +'<div style="height:12px;background:'+(goalPct>=100?'#a5d6a7':'#f0d080')+';border-radius:6px;width:'+goalPct+'%;transition:width .3s"></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +'<div style="text-align:center;background:#f5f2ec;border-radius:8px;padding:8px"><div style="font-size:16px;font-weight:700;color:var(--gold)">'+goalPct+'%</div><div style="font-size:10px;color:var(--muted)">Complete</div></div>'
    +'<div style="text-align:center;background:#f5f2ec;border-radius:8px;padding:8px"><div style="font-size:16px;font-weight:700;color:var(--gold)">'+fmt(goalRemaining)+'</div><div style="font-size:10px;color:var(--muted)">Remaining</div></div>'
    +'<div style="text-align:center;background:'+(onTrack?'#e8f5e9':'#fff8e8')+';border-radius:8px;padding:8px"><div style="font-size:14px;font-weight:700;color:'+(onTrack?'#2e7d32':'#e65100')+'">'+(onTrack?'✅ On Track':'⚡ Push More')+'</div><div style="font-size:10px;color:var(--muted)">'+dealsNeededForGoal+' more deals</div></div>'
    +'</div></div>';

  // mentoring projection
  var mentDealsNow=CFG.dealsCompleted;
  var dealsToMentDrop=Math.max(0,6-mentDealsNow);
  var daysToDrop=dealsPerDay>0&&dealsToMentDrop>0?Math.round(dealsToMentDrop/dealsPerDay):0;
  var mentDropDate=new Date(today);mentDropDate.setDate(today.getDate()+daysToDrop);
  var mentSavingsPerDeal=avgGross*0.10;

  if(CFG.inMentoring){
    html+='<div class="box mb10">';
    if(mentDealsNow>=6){
      html+='<div style="background:#e8f5e9;border-radius:10px;padding:14px;text-align:center">'
        +'<div style="font-size:14px;font-weight:700;color:#2e7d32">👩‍🏫 Mentoring already at 10%!</div>'
        +'<div style="font-size:12px;color:var(--muted);margin-top:4px">Vera keeps an extra '+fmt(mentSavingsPerDeal)+' per deal vs when she started.</div>'
        +'</div>';
    } else {
      html+='<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:8px">👩‍🏫 Mentoring Rate Projection</div>'
        +'<div style="background:#fff8e8;border-radius:10px;padding:12px">'
        +'<div style="font-size:13px;margin-bottom:6px">At current pace, mentoring drops from <strong style="color:#e65100">20%</strong> to <strong style="color:#2e7d32">10%</strong> in:</div>'
        +'<div style="font-size:22px;font-weight:700;color:#e65100;margin-bottom:4px">'+dealsToMentDrop+' more deal'+(dealsToMentDrop!==1?'s':'')+'</div>'
        +'<div style="font-size:12px;color:var(--muted)">Est. date: '+fmtDate(mentDropDate.toISOString().split("T")[0])+'</div>'
        +(mentSavingsPerDeal>0?'<div style="font-size:12px;color:#2e7d32;margin-top:6px;font-weight:600">After that: +'+fmt(mentSavingsPerDeal)+' extra per deal goes to Vera 🎉</div>':"")
        +'<div style="display:flex;gap:4px;margin-top:10px">'
        +[1,2,3,4,5,6].map(function(n){
          var done=n<=mentDealsNow;
          return'<div style="flex:1;height:8px;border-radius:4px;background:'+(done?'#e65100':'#f0ebe0')+'"></div>';
        }).join("")
        +'</div>'
        +'<div style="font-size:11px;color:var(--muted);margin-top:4px;text-align:center">'+mentDealsNow+' of 6 deals done</div>'
        +'</div>';
    }
    html+='</div>';
  }

  /* ── PROFIT TIMELINE ── */
  html+='<div class="section">📅 Profit Timeline — Ascending by Date</div>';
  if(!DEALS.length){
    html+='<div class="empty">No deals yet — record your first deal!</div>';
  } else {
    var sorted=DEALS.slice().sort(function(a,b){return a.closeDate.localeCompare(b.closeDate);});
    var running=0;
    html+='<div class="box">';
    // table header
    html+='<div style="display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr;gap:4px;padding:6px 0;border-bottom:2px solid var(--bdr)">'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Date</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Client</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:right">Profit</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:right">RedOne</div>'
      +'<div style="font-size:10px;font-weight:700;color:#2e7d32;text-transform:uppercase;text-align:right">Running</div>'
      +'</div>';
    sorted.forEach(function(d,i){
      running+=d.vera||0;
      var dt=dtypeMeta(d.type);
      var isLast=i===sorted.length-1;
      html+='<div style="display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr;gap:4px;padding:10px 0;border-bottom:'+(isLast?'none':'1px solid var(--bdr)')+';align-items:start">'
        +'<div><div style="font-size:11px;font-weight:600">'+fmtDate(d.closeDate)+'</div><div style="font-size:10px;color:var(--muted)">'+dt.icon+' '+esc(dt.label.split(" ").slice(1).join(" "))+'</div></div>'
        +'<div><div style="font-size:12px;font-weight:600;word-break:break-word">'+esc(d.client)+'</div>'+(d.builder?'<div style="font-size:10px;color:var(--muted)">'+esc(d.builder)+'</div>':'')+'</div>'
        +'<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:#2e7d32">'+fmtK(d.vera||0)+'</div></div>'
        +'<div style="text-align:right"><div style="font-size:12px;color:#c62828">-'+fmtK(d.redOne||0)+'</div></div>'
        +'<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:'+(isLast?'#1565c0':'var(--txt)')+'">'+fmtK(running)+'</div></div>'
        +'</div>';
    });
    // totals row
    var totalR=DEALS.reduce(function(s,d){return s+(d.redOne||0);},0);
    var totalV=DEALS.reduce(function(s,d){return s+(d.vera||0);},0);
    html+='<div style="display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr;gap:4px;padding:10px 0;background:#f0faf0;border-radius:8px;margin-top:4px">'
      +'<div style="font-size:12px;font-weight:700;padding-left:4px">TOTAL</div>'
      +'<div style="font-size:11px;color:var(--muted)">'+DEALS.length+' deals</div>'
      +'<div style="text-align:right;font-size:13px;font-weight:700;color:#2e7d32">'+fmtK(totalV)+'</div>'
      +'<div style="text-align:right;font-size:13px;font-weight:700;color:#c62828">-'+fmtK(totalR)+'</div>'
      +'<div style="text-align:right;font-size:13px;font-weight:700;color:#1565c0">'+fmtK(totalV)+'</div>'
      +'</div>';
    html+='</div>';
  }

  document.getElementById("pprojection").innerHTML=html;
}

function projBox(label,sub,amt,color){
  return'<div style="background:'+color+'12;border:1px solid '+color+'33;border-radius:10px;padding:10px;text-align:center">'
    +'<div style="font-size:10px;font-weight:700;color:'+color+';text-transform:uppercase;letter-spacing:.4px">'+label+'</div>'
    +'<div style="font-size:16px;font-weight:700;color:'+color+';margin:4px 0">'+fmtK(amt)+'</div>'
    +'<div style="font-size:9px;color:var(--muted)">'+sub+'</div>'
    +'</div>';
}
function getYears(){
  var ys={};DEALS.forEach(function(d){ys[getCapYear(d.closeDate)]=1;});return Object.keys(ys).map(Number);
}
function getBuilders(){
  var bs={};DEALS.filter(function(d){return d.builder;}).forEach(function(d){bs[d.builder]=1;});return Object.keys(bs);
}

/* ── save / load ── */
function save(){
  try{localStorage.setItem("vpd_deals",JSON.stringify(DEALS));}catch(e){}
  try{localStorage.setItem("vpd_cfg",JSON.stringify(CFG));}catch(e){}
  try{localStorage.setItem("vpd_expenses",JSON.stringify(EXPENSES));}catch(e){}
}
function load(){
  try{var a=localStorage.getItem("vpd_deals");if(a)DEALS=JSON.parse(a);}catch(e){}
  try{var b=localStorage.getItem("vpd_cfg");if(b)Object.assign(CFG,JSON.parse(b));}catch(e){}
  try{var c=localStorage.getItem("vpd_expenses");if(c)EXPENSES=JSON.parse(c);}catch(e){}
}

/* ── init ── */
window.onload=function(){
  try{
    load();recalcAll();
    renderExpenses();renderOverview();renderDeals();renderByYear();renderProjection();renderSettings();
  }catch(err){
    document.getElementById("body").innerHTML='<div style="padding:20px;color:#c62828;font-size:14px;background:#fff;border-radius:12px;margin:20px">'
      +'<strong>Error loading dashboard:</strong><br/><br/>'+err.message
      +'<br/><br/>Please clear browser data for this page and reload.'
      +'</div>';
    console.error(err);
  }
};
</script>
</body>
</html>
